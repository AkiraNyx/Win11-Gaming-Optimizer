name: Build EXE

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows executable
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run Windows PowerShell regressions
        shell: pwsh
        run: |
          $tests = @(Get-ChildItem -LiteralPath tests -Filter '*.Tests.ps1' -File)
          if ($tests.Count -eq 0) { throw 'No Windows PowerShell regression tests found.' }
          foreach ($test in $tests) {
            Write-Host "Running $($test.Name)"
            powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $test.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Test and build EXE
        shell: pwsh
        run: cmd.exe /d /c Build.bat

      - name: Upload EXE
        uses: actions/upload-artifact@v7
        with:
          name: Win11Optimizer
          path: dist/Win11Optimizer.exe
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
