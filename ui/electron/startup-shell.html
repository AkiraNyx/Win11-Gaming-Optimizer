<!doctype html>
<html lang="zh-CN" class="ax-theme" data-theme="day">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'">
  <title>Windows 11 游戏优化工具</title>
  <link rel="stylesheet" href="./arinox/styles/index.css">
  <link rel="stylesheet" href="./arinox/titlebar.css">
  <style>
    :root {
      --background: var(--ax-color-bg-default);
      --foreground: var(--ax-color-text-default);
      --muted: var(--ax-color-bg-subtle);
      --muted-foreground: var(--ax-color-text-muted);
      --border: var(--ax-color-border-default);
      --ring: var(--ax-color-focus-ring);
      --destructive: var(--ax-color-danger);
      --destructive-foreground: var(--ax-color-danger-fg);
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      background: radial-gradient(ellipse at 85% 0, var(--fx-horizon), transparent 48%), var(--background);
      color: var(--foreground);
      font-family: var(--ax-font-family-sans);
      letter-spacing: 0;
      -webkit-font-smoothing: antialiased;
    }

    body > main {
      animation: startup-shell-enter var(--ax-motion-duration-base) var(--ax-motion-easing-enter) both;
    }

    button { font: inherit; }
    [hidden] { display: none !important; }

    .electron-drag-region {
      -webkit-app-region: drag;
      app-region: drag;
    }

    .electron-no-drag {
      -webkit-app-region: no-drag;
      app-region: no-drag;
    }

    .optimizer-window-controls svg {
      width: 16px;
      height: 16px;
    }

    .optimizer-window-controls .compact-icon {
      width: 14px;
      height: 14px;
    }

    main {
      display: grid;
      min-height: 0;
      flex: 1;
      place-items: center;
      padding: 48px 24px;
    }

    .startup-content,
    .error-content {
      width: min(420px, calc(100vw - 48px));
      padding: 32px;
      border-radius: var(--fx-radius-glass);
      text-align: center;
    }

    .status-icon {
      width: 32px;
      height: 32px;
      margin-bottom: 20px;
      color: var(--muted-foreground);
    }

    .error-content .status-icon { color: var(--destructive); }

    h1 {
      margin: 0;
      font: 500 28px/1.5 var(--ax-font-family-display);
      letter-spacing: 0;
    }

    .status,
    .error-detail {
      min-height: 20px;
      margin: 8px 0 0;
      color: var(--muted-foreground);
      font-size: 14px;
      line-height: 20px;
    }

    .error-detail {
      max-height: min(240px, 35vh);
      overflow: auto;
      overflow-wrap: anywhere;
    }

    .progress {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 6px;
      width: 100%;
      height: 4px;
      margin-top: 28px;
    }

    .progress-segment {
      height: 4px;
      overflow: hidden;
      border-radius: 2px;
      background: var(--muted);
      transition: background-color var(--ax-motion-duration-base) var(--ax-motion-easing-standard), opacity var(--ax-motion-duration-base) var(--ax-motion-easing-standard);
    }

    .progress-segment.complete,
    .progress-segment.active { background: var(--ax-color-accent-default); }
    .progress-segment.active { animation: pulse 1.2s ease-in-out infinite; }

    .exit-button {
      min-width: 112px;
      height: 36px;
      margin-top: 24px;
      padding: 0 16px;
      border: 1px solid var(--border);
      border-radius: var(--fx-radius-control);
      background: transparent;
      color: var(--foreground);
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: background-color var(--ax-motion-duration-fast) var(--ax-motion-easing-standard);
    }

    .exit-button:hover { background: var(--muted); }
    .exit-button:focus-visible { outline: 3px solid var(--ring); outline-offset: 2px; }

    @keyframes startup-shell-enter {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.55; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <header class="optimizer-header">
    <div class="optimizer-titlebar electron-drag-region">
    <div class="optimizer-brand">
      <span class="optimizer-brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="6" x2="10" y1="11" y2="11"></line>
        <line x1="8" x2="8" y1="9" y2="13"></line>
        <line x1="15" x2="15.01" y1="12" y2="12"></line>
        <line x1="18" x2="18.01" y1="10" y2="10"></line>
        <path d="M17.32 5H6.68a4 4 0 0 0-3.978 3.59c-.006.052-.01.101-.017.152C2.604 9.416 2 14.456 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 0 1 9.828 16h4.344a2 2 0 0 1 1.414.586L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.545-.604-6.584-.685-7.258-.007-.05-.011-.1-.017-.151A4 4 0 0 0 17.32 5z"></path>
      </svg></span>
      <div>
        <h1>Win11 Optimizer</h1>
        <p>让系统，回到适合你的状态。</p>
      </div>
    </div>
    <div class="optimizer-titlebar-actions electron-no-drag"><div class="optimizer-window-controls" aria-label="窗口控制">
      <button id="minimize" class="ax-button optimizer-titlebar-button" data-variant="ghost" data-size="lg" data-icon-only type="button" aria-label="最小化窗口" title="最小化窗口">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path></svg>
      </button>
      <button id="toggle-maximize" class="ax-button optimizer-titlebar-button" data-variant="ghost" data-size="lg" data-icon-only type="button" aria-label="最大化窗口" title="最大化窗口">
        <svg id="maximize-icon" class="compact-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"></rect></svg>
        <svg id="restore-icon" class="compact-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><rect width="14" height="14" x="8" y="8" rx="2" ry="2"></rect><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path></svg>
      </button>
      <button id="close" class="ax-button optimizer-titlebar-button optimizer-window-close" data-variant="ghost" data-size="lg" data-icon-only type="button" aria-label="关闭窗口" title="关闭窗口">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
      </button>
    </div></div>
    </div>
  </header>

  <main id="main" aria-busy="true">
    <section id="startup-content" class="startup-content ax-glass" aria-labelledby="startup-title">
      <svg class="status-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path>
      </svg>
      <h1 id="startup-title">正在启动应用</h1>
      <p id="status" class="status" role="status" aria-live="polite" aria-atomic="true">正在准备启动界面</p>
      <div id="progress" class="progress" role="progressbar" aria-label="启动进度" aria-valuemin="0" aria-valuemax="4" aria-valuenow="0" aria-valuetext="正在准备启动界面">
        <span class="progress-segment"></span>
        <span class="progress-segment"></span>
        <span class="progress-segment"></span>
        <span class="progress-segment"></span>
      </div>
    </section>

    <section id="error-content" class="error-content ax-glass" role="alert" aria-labelledby="error-title" hidden>
      <svg class="status-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><line x1="12" x2="12" y1="8" y2="12"></line><line x1="12" x2="12.01" y1="16" y2="16"></line></svg>
      <h1 id="error-title">应用未能启动</h1>
      <p id="error-detail" class="error-detail">启动过程中发生未知错误。</p>
      <button id="exit" class="exit-button" type="button">退出应用</button>
    </section>
  </main>

  <script src="./startup-shell.js" defer></script>
</body>
</html>
